# ~/.config/hypr/hyprland.conf  — managed in dotfiles (hypr/)
# Idiomatic Hyprland keybinds. Docs: https://wiki.hypr.land/Configuring/

################
### MONITORS ###
################
# Match the desktop layout used on this machine:
# - Dell U2718Q on the left at 150% (logical size 2560x1440)
# - LG TV on the right at 125% (logical size 3072x1728), bottom-aligned
monitor = DP-1,3840x2160@60,0x288,1.5
monitor = HDMI-A-1,3840x2160@120,2560x0,1.25
# Fall back gracefully for any other output.
monitor = ,preferred,auto,1

###################
### ENVIRONMENT ###
###################
# NVIDIA (proprietary 595 + explicit sync already active on this box).
# No legacy WLR_* hacks: Hyprland uses aquamarine, and explicit sync is on.
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto   # Electron/Chromium apps -> native Wayland
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# Identify this session correctly to apps and desktop portals.
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
# Plain GTK3 apps (blueman-manager, etc.) don't speak the portal-based
# color-scheme protocol at all -- only GTK4/libadwaita and apps with their
# own portal-query code (Firefox) do. GTK3's own legacy dark-mode switch,
# gtk-application-prefer-dark-theme, isn't even in this system's gsettings
# schema, so there's no gsettings-level fix for GTK3 apps. Force it directly
# instead; confirmed live against blueman-manager.
env = GTK_THEME,Adwaita:dark
# GTK4 dropped GTK3's loadable immodules (no more im-ibus.so) and now only
# composes dead-key/compose-key sequences itself if it's told to use its
# built-in "simple" context; otherwise it tries the Wayland input-method
# protocol, finds no provider bound (ibus on this box doesn't implement
# input-method-v2, just the old X11/D-Bus IBus protocol), and silently drops
# compose sequences. fuzzel is unaffected since it isn't GTK and composes
# keys itself via libxkbcommon directly. Confirmed live against anyrun/walker.
env = GTK_IM_MODULE,simple

################
### XWAYLAND ###
################
# Both monitors run fractional scale (1.5 / 1.25). Without this, XWayland
# clients render at scale 1 and get bitmap-upscaled by Hyprland -> blurry
# text (hit Vivaldi-via-XWayland and Obsidian's Flatpak, which also runs
# --ozone-platform=x11). This makes Hyprland do the scaling instead, sharp
# but XWayland apps may not know the real scale -> may render UI small;
# compensate per-app (e.g. Chromium/Electron: --force-device-scale-factor=1.25).
xwayland {
    force_zero_scaling = true
}

#################
### AUTOSTART ###
#################
# Let portals / systemd user services inherit the Wayland session env.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE
# xdg-desktop-portal.service has Requisite=graphical-session.target — it
# checks the target is already active rather than pulling it in itself.
# Hyprland has no built-in systemd session integration, so that target only
# ever activates because this session is launched through uwsm (see the
# "Hyprland (uwsm)" entry at /usr/local/share/wayland-sessions/, sourced from
# hypr/hyprland-managed.desktop in this repo) — uwsm's wayland-session@.target
# has BindsTo=graphical-session.target, which is what starts it. Don't
# hand-launch the portal here; if graphical-session.target isn't active,
# that's a sign this session didn't actually go through uwsm.
# The actual dark-mode source of truth: xdg-desktop-portal-gtk reads this
# straight out of GSettings and republishes it over org.freedesktop.appearance
# (see ~/.config/xdg-desktop-portal/hyprland-portals.conf for backend
# routing — no GNOME Shell involved). No "gtk-theme Adwaita-dark" hack here:
# that theme name doesn't exist on this system and silently did nothing.
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = waybar
exec-once = mako
exec-once = hypridle
# GUI daemon for the global (all-workspaces, recency-sorted) Super+Tab
# switcher -- see the KEYBINDINGS section below for the actual bind.
exec-once = ~/.cargo/bin/hyprswitch init --show-title --size-factor 5.5 --workspaces-per-row 5 &
exec-once = swaybg -i ~/Pictures/wall.jpg -m fill
# polkit auth agent (GUI privilege prompts). Verify path: rpm -ql mate-polkit | grep agent-1
exec-once = /usr/libexec/polkit-mate-authentication-agent-1
# Clipboard history (works because Hyprland provides data-control):
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

#############
### INPUT ###
#############
input {
    kb_layout = us
    kb_options = ctrl:nocaps, compose:ralt
    # 0: cursor movement never changes focus, only clicking does. Was 1
    # (classic focus-follows-mouse, any hover steals focus).
    follow_mouse = 0
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

####################
### LOOK & FEEL ####
####################
general {
    gaps_in = 10
    gaps_out = 10
    border_size = 1
    # Matches this host's tmux active-tab accent (@tab_accent = #7fae7f, set
    # per-host at the bottom of .tmux.conf) rather than an independent color.
    col.active_border = rgba(7fae7fee)
    col.inactive_border = rgba(313244aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 0
    # Compositor-level opacity, unlike Ghostty's own background-opacity: this
    # fades the whole composited window (text and all), not just a background
    # layer, since most apps (Firefox included) don't expose a separate
    # background-alpha knob of their own. Same value for active/inactive --
    # no focus-based fade.
    active_opacity = 0.93
    inactive_opacity = 0.93
    blur {
        enabled = true
        size = 3
        passes = 2
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = windows, 1, 4, ease
    animation = fade, 1, 4, ease
    animation = workspaces, 1, 4, ease
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    # Second wake path. hypridle's on-resume `dpms on` failed to fire on
    # 2026-09-14 (twice), leaving the OLEDs dark until a manual dispatch.
    # These make the compositor itself re-enable outputs on first input.
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
}

debug {
    # Off by default, which leaves only aquamarine backend lines in
    # $XDG_RUNTIME_DIR/hypr/*/hyprland.log. On, so a failed wake shows whether
    # `dpms on` was ever dispatched.
    disable_logs = false
}

###################
### KEYBINDINGS ###
###################
$mod = SUPER
$term = ghostty
$menu = fuzzel
$fileManager = nautilus
$switchKey = tab
$switchReverseKey = grave

# Every bind is a bindd: the 3rd field is the text the keybinds help popup
# (Super+?, scripts/keybinds.sh) shows. It reads them live from hyprctl, so
# there is no second list to keep in sync. The "Group:" prefix makes the
# popup searchable by group. Descriptions cannot contain commas.

# Help
bindd = $mod SHIFT, Slash, Help: search and run keybinds, exec, bash ~/.config/hypr/scripts/keybinds.sh

# Apps / launchers
bindd = $mod, Return, App: terminal, exec, $term
bindd = $mod, D, App: launcher, exec, $menu
bindd = $mod, Slash, App: launcher (old Pop key), exec, $menu
bindd = $mod, E, App: file manager, exec, $fileManager
bindd = $mod, C, App: calculator + forex, exec, bash ~/.config/hypr/scripts/calc.sh
bindd = $mod, V, App: clipboard history, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bindd = $mod, A, App: approval dashboard (chromeless ticketoffice), exec, bash ~/.config/hypr/scripts/approval-window.sh
# Absolute path: the session PATH lacks ~/.local/bin.
bindd = $mod, N, App: wifi/bluetooth/vpn quick panel, exec, ~/.local/bin/orbit toggle top-right

# Hardware volume keys: wpctl changes volume, then Mako shows the result.
bindeld = , XF86AudioRaiseVolume, Audio: volume up, exec, ~/.config/hypr/scripts/volume-osd.sh raise
bindeld = , XF86AudioLowerVolume, Audio: volume down, exec, ~/.config/hypr/scripts/volume-osd.sh lower
bindld = , XF86AudioMute, Audio: mute speakers, exec, ~/.config/hypr/scripts/volume-osd.sh mute
bindld = , XF86AudioMicMute, Audio: mute microphone, exec, ~/.config/hypr/scripts/volume-osd.sh mic-mute

# Window management
bindd = $mod, Q, Window: close, killactive,
bindd = $mod SHIFT, Space, Window: toggle floating, togglefloating,
bindd = $mod, F, Window: maximize (keep bar), fullscreen, 1
bindd = $mod SHIFT, F, Window: true fullscreen, fullscreen, 0
bindd = $mod CTRL, F, Window: fake fullscreen (client only; pane stays tiled), fullscreenstate, 0 2
bindd = $mod, O, Window: flip split orientation, layoutmsg, togglesplit
bindd = $mod, P, Window: toggle pseudotile, pseudo,
bindd = $mod SHIFT, O, Window: toggle forced opacity (e.g. video), setprop, activewindow opaque toggle

# Global window switcher (hyprswitch, daemon started above via ~/.cargo/bin): hold $mod,
# tap tab repeatedly to step back through every window on every workspace
# sorted by recency, hold+grave to step forward again, release $mod to switch.
# --mod-key takes hyprswitch's own lowercase enum (super/alt/ctrl/shift), not
# Hyprland's own SUPER/ALT bind-mod spelling that $mod expands to -- hardcoded
# here rather than reusing $mod, which would pass "SUPER" and fail to parse.
bindd = $mod, $switchKey, Switch: next window (all workspaces by recency), exec, ~/.cargo/bin/hyprswitch gui --mod-key super --key $switchKey --close mod-key-release --reverse-key=key=$switchReverseKey --sort-recent && ~/.cargo/bin/hyprswitch dispatch
bindd = $mod $switchReverseKey, $switchKey, Switch: previous window, exec, ~/.cargo/bin/hyprswitch gui --mod-key super --key $switchKey --close mod-key-release --reverse-key=key=$switchReverseKey --sort-recent && ~/.cargo/bin/hyprswitch dispatch -r

# Focus (vim keys, like your Pop setup)
bindd = $mod, h, Focus: left, movefocus, l
bindd = $mod, l, Focus: right, movefocus, r
bindd = $mod, k, Focus: up, movefocus, u
bindd = $mod, j, Focus: down, movefocus, d

# Move the focused window (modeless SUPER+SHIFT+hjkl)
bindd = $mod SHIFT, h, Move window: left, movewindow, l
bindd = $mod SHIFT, l, Move window: right, movewindow, r
bindd = $mod SHIFT, k, Move window: up, movewindow, u
bindd = $mod SHIFT, j, Move window: down, movewindow, d

# Resize the focused window (repeatable)
binded = $mod CTRL, h, Resize window: narrower, resizeactive, -40 0
binded = $mod CTRL, l, Resize window: wider, resizeactive, 40 0
binded = $mod CTRL, k, Resize window: shorter, resizeactive, 0 -40
binded = $mod CTRL, j, Resize window: taller, resizeactive, 0 40

# Workspaces — steal the workspace onto the CURRENT monitor rather than
# jumping focus to whichever monitor already shows it. If the target lives
# on the other monitor, Hyprland moves it here (the monitors swap).
bindd = $mod, 1, Workspace: go to 1, focusworkspaceoncurrentmonitor, 1
bindd = $mod, 2, Workspace: go to 2, focusworkspaceoncurrentmonitor, 2
bindd = $mod, 3, Workspace: go to 3, focusworkspaceoncurrentmonitor, 3
bindd = $mod, 4, Workspace: go to 4, focusworkspaceoncurrentmonitor, 4
bindd = $mod, 5, Workspace: go to 5, focusworkspaceoncurrentmonitor, 5
bindd = $mod, 6, Workspace: go to 6, focusworkspaceoncurrentmonitor, 6
bindd = $mod, 7, Workspace: go to 7, focusworkspaceoncurrentmonitor, 7
bindd = $mod, 8, Workspace: go to 8, focusworkspaceoncurrentmonitor, 8
bindd = $mod, 9, Workspace: go to 9, focusworkspaceoncurrentmonitor, 9
bindd = $mod, 0, Workspace: go to 10, focusworkspaceoncurrentmonitor, 10
# Move focused window to workspace
bindd = $mod SHIFT, 1, Workspace: send window to 1, movetoworkspace, 1
bindd = $mod SHIFT, 2, Workspace: send window to 2, movetoworkspace, 2
bindd = $mod SHIFT, 3, Workspace: send window to 3, movetoworkspace, 3
bindd = $mod SHIFT, 4, Workspace: send window to 4, movetoworkspace, 4
bindd = $mod SHIFT, 5, Workspace: send window to 5, movetoworkspace, 5
bindd = $mod SHIFT, 6, Workspace: send window to 6, movetoworkspace, 6
bindd = $mod SHIFT, 7, Workspace: send window to 7, movetoworkspace, 7
bindd = $mod SHIFT, 8, Workspace: send window to 8, movetoworkspace, 8
bindd = $mod SHIFT, 9, Workspace: send window to 9, movetoworkspace, 9
bindd = $mod SHIFT, 0, Workspace: send window to 10, movetoworkspace, 10
# Scroll through workspaces
bindd = $mod, mouse_down, Workspace: next, workspace, e+1
bindd = $mod, mouse_up, Workspace: previous, workspace, e-1

# Screenshots (see scripts/screenshot.sh) -> clipboard
$shot = bash ~/.config/hypr/scripts/screenshot.sh
bindd = $mod, S, Screenshot: monitor -> clipboard, exec, $shot full
bindd = $mod SHIFT, S, Screenshot: region -> clipboard, exec, $shot region
bindd = $mod ALT, S, Screenshot: window -> clipboard, exec, $shot window
# Same, but also save to ~/Pictures/Screenshots
bindd = $mod SHIFT CTRL, S, Screenshot: monitor -> clipboard + file, exec, $shot full save
bindd = $mod CTRL, S, Screenshot: region -> clipboard + file, exec, $shot region save
bindd = $mod CTRL ALT, S, Screenshot: window -> clipboard + file, exec, $shot window save
# Save -> ~/Pictures/Screenshots, Copy -> clipboard
bindd = $mod SHIFT, E, Screenshot: mark up clipboard image in swappy, exec, wl-paste --type image/png | swappy -f -

# Session
bindd = $mod, Escape, Session: lock, exec, hyprlock
bindd = $mod SHIFT, R, Session: reload Hyprland config, exec, hyprctl reload
# Back to GDM (GNOME still your fallback)
bindd = $mod SHIFT, M, Session: quit Hyprland, exit,
bindd = $mod SHIFT, T, Session: re-modeset monitors (blank TV), exec, bash ~/.config/hypr/scripts/kick-monitor.sh

# Mouse: move/resize floating windows
bindmd = $mod, mouse:272, Mouse: drag to move window, movewindow
bindmd = $mod, mouse:273, Mouse: drag to resize window, resizewindow

###################
### WINDOWRULES ###
###################
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:title ^(Open File)(.*)$, float on
# Chromium --app= mode signals "fixed-size window", which Hyprland
# auto-floats; override so it tiles like any other window.
windowrule = match:class ^(vivaldi-approval)$, float off
windowrule = match:title ^(Save File)(.*)$, float on
